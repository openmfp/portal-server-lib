name: ci
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  pipe:
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: false
    uses: openmfp/gha/.github/workflows/pipeline-node-module.yml@501a82f466938693efb9f9bdd04e307d402440fd # main
    secrets: inherit
    with:
      environment: npmjs:@openmfp/portal-server-lib


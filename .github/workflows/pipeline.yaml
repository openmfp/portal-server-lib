name: ci
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  pipe:
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: false
    uses: openmfp/gha/.github/workflows/pipeline-node-module.yml@8ab150881aeeecfc088878622eb2cd862e4c9cf2 # main
    secrets: inherit
    with:
      environment: npmjs:@openmfp/portal-server-lib

